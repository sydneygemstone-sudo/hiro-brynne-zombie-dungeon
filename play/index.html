<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baseline preview</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#132d36;color:#f5e8c9;font-family:system-ui}nav{position:fixed;left:6px;top:20px;width:66px;display:grid;gap:9px;z-index:5}nav a,nav button{display:grid;place-content:center;min-height:48px;border:1px solid #6d9693;border-radius:10px;background:#25474e;color:#f5e8c9;text-decoration:none;font:700 12px system-ui;cursor:pointer}iframe{position:fixed;left:80px;top:0;width:calc(100% - 80px);height:100%;border:0}#note{position:fixed;left:4px;bottom:6px;width:70px;font-size:10px;line-height:1.5;text-align:center}button:focus-visible,a:focus-visible{outline:3px solid #e3c584}</style></head><body><nav><a id="home" href="../hub/">HUB</a><a id="review" href="../hub/review.html">测评</a><button id="language">English</button><button id="full">全屏</button><a id="guide" href="../hub/guide.html">说明</a></nav><iframe id="game" title="Existing baseline" allow="fullscreen; autoplay" src="../public/singleplayer.html"></iframe><div id="note"></div><script>let en=new URLSearchParams(location.search).get('lang')==='en';function draw(){document.documentElement.lang=en?'en':'zh-CN';document.getElementById('language').textContent=en?'中文':'English';document.getElementById('review').textContent=en?'Review':'测评';document.getElementById('full').textContent=en?'Full':'全屏';document.getElementById('guide').textContent=en?'Guide':'说明';document.getElementById('note').textContent=en?'Original game UI retained. See guide for control limits.':'保留原游戏界面，操作边界见说明';for(const[id,file]of [['home',''],['review','review.html'],['guide','guide.html']])document.getElementById(id).href='../hub/'+file+'?lang='+(en?'en':'zh-CN');}document.getElementById('language').onclick=()=>{en=!en;history.replaceState(null,'','?lang='+(en?'en':'zh-CN'));draw();};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}};draw();</script></body></html>
